<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/logo.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Muadh Adekunle Monsuru — software engineer based in Lagos."
		/>
		<meta name="theme-color" content="#0d0d10" />
		<link
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Manrope:wght@200..800&display=swap"
			rel="stylesheet"
		/>
		<title>Muadh Monsur</title>
		<script>
			!(function () {
				var root = document.documentElement;
				root.classList.remove('dark', 'light');
				var stored = localStorage.getItem('theme');
				if (stored) {
					root.classList.add(stored.replace(/"/g, ''));
				} else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
					root.classList.add('dark');
				} else {
					root.classList.add('light');
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
